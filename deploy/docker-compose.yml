services:
  starstack:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: starstack:latest
    container_name: starstack
    ports:
      - "8290:80"                     # 对外 8290 → 容器 nginx :80
    volumes:
      - ./data:/app/data:rw          # SQLite + 个人空间 + 缓存
      - /data/cloud:/share:rw        # 宿主机目录 → 共享盘（按需调整路径）
    environment:
      - LISTEN=:8080                 # Go 内部端口（nginx 反代目标）
      - DATA_DIR=/app/data
      - SHARE_ROOT=/share
      # - SECRET=                     # 留空则首次启动自动生成（存于 data 目录）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped