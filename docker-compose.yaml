services:
  starstack:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
      network: host
    image: starstack:latest
    restart: unless-stopped

    ports:
      - "${PORT:-8290}:80"

    volumes:
      - ~/git/docker/starstack:/app/data:rw # 数据：SQLite + 个人空间 + 缓存
      - ${SHARE_DIR:-/home/shiyi/x}:/share:rw # 宿主机目录 → 共享盘

    environment:
      - SECRET=${SECRET:-} # 见根目录 .env；留空则首次启动自动生成并落盘

