services:
  starstack:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
      network: host
      entitlements:
        - network.host
    image: starstack:latest
    restart: unless-stopped

    ports:
      - "${PORT:-8290}:80"

    volumes:
      - ~/git/docker/starstack:/app/data:rw
      - ${SHARE_DIR:-/home/shiyi/x}:/share:rw

    environment:
      - SECRET=${SECRET:-}

